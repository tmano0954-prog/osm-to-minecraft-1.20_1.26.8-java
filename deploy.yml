name: Deploy OSM to Minecraft Generator to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Compile Rust Engine to WebAssembly
        run: |
          cd rust_engine
          wasm-pack build --target web --out-dir ../frontend/wasm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Static Web Site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend'

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        